    if (ch) ch.onclick = async () => { const r = await pedir('chave', {}); avisar(r.ok ? 'Abrindo a janelinha da chave...' : r.mensagem); };
  };
  pintarVoz();
  $$('[data-motor]').forEach((b) => (b.onclick = () => {
    if (escolha.voz.motor === b.dataset.motor) return;
    const antes = c.bloco.voz || {};
    escolha.voz = { motor: b.dataset.motor, id: antes.motor === b.dataset.motor ? antes.id || '' : '' };
    sujar('voz');
    pintarVoz();
  }));
  $('#s-voz').onclick = async () => {
    if (!escolha.voz.motor) return avisar('Escolha de onde vem a voz');
    let r = await pedir('bloco', { voz: escolha.voz });
    if (r.ok) r = await pedir('campos', { campos: campos('voz') });
    depoisDeSalvar('voz', r);
  };

  // Cor
  pintarCor();
  $$('.paleta button').forEach((b) => (b.onclick = () => { escolha.cor = b.dataset.cor.toLowerCase(); $('#cor-propria').value = escolha.cor; sujar('cor'); pintarCor(); }));
  $('#cor-propria').oninput = (e) => { escolha.cor = e.target.value; sujar('cor'); pintarCor(); };
  $('#s-cor').onclick = async () => {
    if (!escolha.cor) return avisar('Escolha uma cor');
    depoisDeSalvar('cor', await pedir('bloco', { cor: escolha.cor }));
  };

  // Descrições nas redes
  $$('#k-redes [data-copiar]').forEach((b) => (b.onclick = () => copiar($(`#d-${b.dataset.copiar}`).value)));
  $$('#k-redes textarea').forEach((t) => t.addEventListener('input', contar));
  contar();
  $('#s-desc').onclick = async () => {
    const d = Object.fromEntries(Object.keys(c.limites).map((k) => [k, $(`#d-${k}`).value]));
    const passou = Object.keys(d).filter((k) => [...d[k]].length > c.limites[k]);
    depoisDeSalvar('redes', await pedir('descricoes', d), passou.length ? 'Salvo, mas passou do limite (em vermelho)' : 'Salvo ✓');
  };

  // Logo e capa
  for (const tipo of ['logo', 'banner']) {
    $(`#up-${tipo}`).onchange = async (e) => {
      const f = e.target.files[0];
      if (!f) return;
      avisar('Preparando a imagem...');
      try {
        const img = await prepararImagem(f, tipo);
        const r = await pedir('imagem', { tipo, dados: img.dados });
        if (!r.ok) return avisar(r.mensagem);
        avisar(img.pequena ? 'Salvo, mas a imagem é pequena: pode ficar borrada' : 'Salvo ✓');
        conferido = null;
        carregarConferir();
        await recarregar(!sujos.size);
      } catch { avisar('Não consegui abrir essa imagem. Use uma PNG ou JPG.'); }
    };
    const rm = $(`#rm-${tipo}`);
    if (rm) rm.onclick = async () => {
      if (!confirm(tipo === 'logo' ? 'Tirar o logo do canal?' : 'Tirar a capa do canal?')) return;
      const r = await pedir('imagem', { tipo, dados: null });
      if (!r.ok) return avisar(r.mensagem);
      conferido = null;
      carregarConferir();
      await recarregar(!sujos.size);
    };
  }
}
function contar() {
  for (const k of Object.keys(estado.canal.limites)) {
    const n = [...($(`#d-${k}`).value || '')].length, lim = estado.canal.limites[k], el = $(`#conta-${k}`);
    el.textContent = `${n.toLocaleString('pt-BR')} de ${lim.toLocaleString('pt-BR')}`;
    el.classList.toggle('passou', n > lim);
  }
}
// O logo sai quadrado (PNG, até 800 x 800) e a capa em 2560 x 1440 (JPG): corta as bordas do que sobrar
function prepararImagem(arquivo, tipo) {
  return new Promise((ok, erro) => {
    const url = URL.createObjectURL(arquivo), img = new Image();
    img.onerror = () => { URL.revokeObjectURL(url); erro(); };
    img.onload = () => {
      const w = img.naturalWidth, h = img.naturalHeight;
      const [W, H] = tipo === 'logo' ? Array(2).fill(Math.min(800, w, h)) : [2560, 1440];
      const alvo = W / H;
      let sw = w, sh = h;
      if (w / h > alvo) sw = h * alvo; else sh = w / alvo;
      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const g = c.getContext('2d');
      g.imageSmoothingQuality = 'high';
      if (tipo === 'banner') { g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); }
      g.drawImage(img, (w - sw) / 2, (h - sh) / 2, sw, sh, 0, 0, W, H);
      URL.revokeObjectURL(url);
      ok({ dados: c.toDataURL(tipo === 'logo' ? 'image/png' : 'image/jpeg', 0.9), pequena: tipo === 'logo' ? Math.min(w, h) < 300 : w < 2048 });
    };
    img.src = url;
  });
}

// ElevenLabs (só quando a voz é ela)
function htmlCustos(c) {
  if (!c || !((c.ia && c.ia.total) || c.elevenlabs)) return '';
  const l = [];
  if (c.ia && c.ia.total) {
    const ps = [...new Set((c.ia.conversas || []).map((x) => x.programa))].join(' e ');
    l.push(`<li><b>IA</b><span>${curto(c.ia.total)}${c.ia.total >= 1e6 ? ' de' : ''} tokens</span><small>${esc(ps)}${(c.ia.conversas || []).length > 1 ? `, em ${c.ia.conversas.length} conversas` : ''}: ${curto(c.ia.cache)} relidos da memória da conversa, ${curto(c.ia.entrada)} lidos de novo e ${curto(c.ia.saida)} escritos</small></li>`);
  }
  if (c.elevenlabs) l.push(`<li><b>ElevenLabs</b><span>${mil(c.elevenlabs.creditos)} créditos</span><small>${mil(c.elevenlabs.caracteres)} letras narradas${c.elevenlabs.sobraram != null ? ` · sobraram ${mil(c.elevenlabs.sobraram)} no plano` : ''}</small></li>`);
  return `<section class="quadro vidro custos"><h3>Quanto este vídeo gastou</h3><ul>${l.join('')}</ul></section>`;
}

// ---------- Markdown simples (o roteiro) ----------
function inline(t) {
  return esc(t)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\*)/g, '$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '$1');
}
function markdown(md) {
  const L = String(md).replace(/\r/g, '').split('\n'), item = /^\s*([-*+]|\d+[.)])\s+/;
  let h = '', i = 0;
  while (i < L.length) {
    const l = L[i];
    let m;
    if (!l.trim()) { i++; continue; }
    if ((m = l.match(/^(#{1,4})\s+(.*)$/))) { const n = m[1].length + 1; h += `<h${n}>${inline(m[2])}</h${n}>`; i++; continue; }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)) { h += '<hr>'; i++; continue; }
    if (l.trim().startsWith('|')) {
      const linhas = [];
      while (i < L.length && L[i].trim().startsWith('|')) linhas.push(L[i++]);
      const celulas = (x) => x.trim().replace(/^\||\|$/g, '').split('|').map((c) => inline(c.trim()));
      const sep = linhas.length > 1 && /^\s*\|?[\s:|-]+\|?\s*$/.test(linhas[1]);
      const cab = sep ? `<thead><tr>${celulas(linhas[0]).map((c) => `<th>${c}</th>`).join('')}</tr></thead>` : '';
      h += `<div class="tabela"><table>${cab}<tbody>${linhas.slice(sep ? 2 : 0).map((x) => `<tr>${celulas(x).map((c) => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
      continue;
    }
    if (l.startsWith('>')) {
      const q = [];
      while (i < L.length && L[i].startsWith('>')) q.push(L[i++].replace(/^>\s?/, ''));
      h += `<blockquote>${q.map(inline).join('<br>')}</blockquote>`;
      continue;
    }
    if (item.test(l)) {
      const ordem = /^\s*\d+[.)]\s+/.test(l), inicio = ordem ? parseInt(l, 10) || 1 : 1, itens = [];
      while (i < L.length && item.test(L[i])) {
        itens.push(L[i++].replace(item, ''));
        while (i < L.length && /^\s{2,}\S/.test(L[i]) && !item.test(L[i])) itens[itens.length - 1] += ' ' + L[i++].trim();
      }
      h += ordem ? `<ol start="${inicio}">` : '<ul>';
      h += itens.map((x) => `<li>${inline(x)}</li>`).join('') + (ordem ? '</ol>' : '</ul>');
      continue;
    }
    const par = [];
    while (i < L.length && L[i].trim() && !/^(#{1,4}\s|>|\s*\|)/.test(L[i]) && !item.test(L[i])) par.push(L[i++]);
    h += `<p>${par.map(inline).join('<br>')}</p>`;
  }
  return h;
}

// Pasta arrastada: os arquivos de dentro, com o caminho de cada um
async function juntarPasta(entrada, prefixo, lista) {
  if (entrada.isFile) { lista.push({ caminho: prefixo + entrada.name, file: await new Promise((ok, erro) => entrada.file(ok, erro)) }); return; }
  const leitor = entrada.createReader();
  for (let lote = await new Promise((ok, erro) => leitor.readEntries(ok, erro)); lote.length; lote = await new Promise((ok, erro) => leitor.readEntries(ok, erro))) {
    for (const x of lote) await juntarPasta(x, `${prefixo}${entrada.name}/`, lista);
  }
}
function ligarZonaExtra(produto) {
  const zona = $('#soltar-extra');
  if (!zona) return;
  const msg = (html, tipo) => { $('#extra-msg').innerHTML = html ? `<p class="caixa ${tipo}">${html}</p>` : ''; };
  const enviar = (etapa, corpo, extra = '') => fetch(`/api/extra/${etapa}?t=${T}&produto=${encodeURIComponent(produto)}${extra}`, { method: 'POST', headers: { 'X-Painel': T, 'Content-Type': 'application/octet-stream' }, body: corpo })
    .then((r) => r.json()).catch(() => ({ ok: false, mensagem: 'O painel perdeu a ligação com a Máquina. Peça pra IA: "abre o painel".' }));
  async function trazer(arquivo, pasta) {
    sujos.add('extra');
    msg('Trazendo pra sua Máquina... (uns segundos)', 'espera');
    let r = null;
    if (arquivo) r = await enviar('um', arquivo, `&nome=${encodeURIComponent(arquivo.name)}`);
    else {
      // Só o que serve (os roteiros, os modelos de canal, os PDFs e os zips): as capas de prévia ficam de fora
      const uteis = pasta.filter((x) => /(roteiro\.(json|md)|100-temas\.md|canal\.md|prompts\.md|\.pdf|\.zip)$/i.test(x.caminho));
      if (!uteis.length) r = { ok: false, mensagem: 'Nessa pasta não achei nenhum arquivo dos extras. Confira se é a pasta que veio do zip da área de membros.' };
      else {
        await enviar('comecar', '');
        for (let i = 0; i < uteis.length && !r; i++) {
          if (uteis.length > 8) msg(`Trazendo pra sua Máquina... ${i + 1} de ${uteis.length} arquivos`, 'espera');
          const x = await enviar('arquivo', uteis[i].file, `&caminho=${encodeURIComponent(uteis[i].caminho)}`);
          if (!x.ok) r = x;
        }
        r = r || await enviar('fim', '');
      }
    }
    sujos.delete('extra');
    if (r.versao) vigiar.ultima = r.versao;
    if (!r.ok) return msg(esc(r.mensagem || 'Não deu certo. Tente de novo.'), 'erro');
    // Vai pra tela do produto que entrou (ou fica nesta, se entrou mais de um), com o que aconteceu no topo
    const vai = r.feitos.length === 1 ? r.feitos[0].produto : produto;
    const rota = vai ? `#/potencializar/${vai}` : '#/potencializar';
    extraMsg = { rota, tipo: 'ok', html: textoDoExtra(r.feitos) };
    await recarregar(false);
    if (location.hash !== rota) location.replace(rota); else { await mostrar(); window.scrollTo(0, 0); }
  }
  ['dragenter', 'dragover'].forEach((ev) => zona.addEventListener(ev, (e) => { e.preventDefault(); zona.classList.add('em-cima'); }));
  ['dragleave', 'drop'].forEach((ev) => zona.addEventListener(ev, () => zona.classList.remove('em-cima')));
  zona.addEventListener('drop', async (e) => {
    e.preventDefault();
    const entradas = [...e.dataTransfer.items].map((i) => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
    const arquivos = [...e.dataTransfer.files];
    if (entradas.length === 1 && entradas[0].isFile) return trazer(arquivos[0]);
    const lista = [];
    for (const x of entradas) await juntarPasta(x, '', lista);
    trazer(null, lista);
  });
  $('#up-extra').onchange = (e) => { if (e.target.files[0]) trazer(e.target.files[0]); };
  const pasta = $('#up-extra-pasta');
  if (pasta) pasta.onchange = (e) => { if (e.target.files.length) trazer(null, [...e.target.files].map((file) => ({ caminho: file.webkitRelativePath || file.name, file }))); };
}

const BOAS = [
  ['Uma conversa nova pra cada vídeo', 'A IA lê o seu canal de novo e o vídeo sai melhor.'],
  ['Fale com a IA como fala com um amigo', 'Com detalhe e com sinceridade. Ela entende melhor assim.'],
  ['Não entendeu? Peça de novo', 'Mande: "explica de um jeito simples". Ela não se cansa.'],
  ['Travou? Peça ajuda pra IA', 'Mande: "Me ajuda a fazer isso". Ela te leva passo a passo.'],
  ['Deu erro? Copie e mande pra IA', 'Não precisa entender o erro: ela entende.'],
  ['Diga o que achou de cada cena', 'Gostei ou Mudar. A IA aprende o seu gosto e acerta mais.'],
  ['Leia as cenas antes do vídeo', 'A IA escreve cada cena em 10 linhas. Mudar ali é mais fácil do que depois.'],
  ['Uma coisa de cada vez', 'Peça uma mudança, confira, e só depois peça a próxima.'],

const semAcentoAjuda = (t) => String(t).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
let temaAjuda = 'todos';
function paginaAjuda() {
  app.innerHTML = `
  <header class="cabeca">
    <p class="chamada">Calma, tem jeito pra tudo</p>
    <h1>Como podemos <span class="sublinha">ajudar?${rabisco('sublinhado', 6)}</span></h1>
    <p class="sub">Procure a sua dúvida. Quase tudo se resolve pedindo pra sua IA: cada resposta já tem o pedido pronto pra você copiar e mandar.</p>
  </header>
  <label class="busca-ajuda"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
    <input type="text" id="busca-ajuda" placeholder="Digite a sua dúvida aqui" autocomplete="off"></label>
  <div class="segmentos ajuda-temas">${[['todos', 'Tudo'], ...AJUDA.map(([id, nome]) => [id, nome])].map(([id, nome]) => `<button aria-pressed="${temaAjuda === id}" data-tema="${id}">${esc(nome)}</button>`).join('')}</div>
  <div id="perguntas">${AJUDA.map(([id, nome, itens]) => `<section class="quadro vidro tema-ajuda" data-tema="${id}">
    <h2>${esc(nome)}</h2>
    ${itens.map(([p, r, pedido, ir]) => `<details class="pergunta" data-busca="${esc(semAcentoAjuda(`${p} ${r.replace(/<[^>]+>/g, '')} ${pedido || ''}`))}"><summary>${esc(p)}</summary>
      <div class="resposta"><p>${r}</p>${pedido ? `<p class="pede">Peça pra sua IA:</p>${pedidoPronto(pedido)}` : ''}${ir ? `<div class="acoes"><a class="botao mini claro" href="${ir[1]}">${esc(ir[0])} →</a></div>` : ''}</div></details>`).join('')}
  </section>`).join('')}<p class="nada-achado" hidden>Não achei. Tente outra palavra, ou pergunte direto pra sua IA: ela sabe tudo da Máquina.</p></div>
  <h2>Boas práticas</h2>
  <p class="sub-quadro">O jeito de se virar sozinho, sem esperar ninguém.</p>
  <ol class="dicas-boas">${BOAS.map(([b, s], i) => `<li class="vidro" style="--r:${['-.6deg', '.5deg', '-.3deg', '.7deg'][i % 4]}"><b>${esc(b)}</b><span>${esc(s)}</span></li>`).join('')}</ol>
  <section class="quadro vidro">
    <h2>Ainda não resolveu?</h2>
    <p class="sub-quadro">Primeiro, conte pra sua IA o que aconteceu, do seu jeito. Ela resolve quase tudo.</p>
    ${pedidoPronto('Me ajuda a resolver isso. O que aconteceu foi: [conte aqui, do seu jeito]')}
    <p class="suave" style="margin-top:16px">Problema com a compra ou com o acesso à área de membros, ou a IA tentou e não resolveu? Escreva pra <b>desconstruindouniverso@gmail.com</b>, contando o que aconteceu.</p>
  </section>`;
  ligarCopiar(app);
  const busca = $('#busca-ajuda');
  const filtrar = () => {
    const palavras = semAcentoAjuda(busca.value).split(/\s+/).filter(Boolean);
    let achou = 0;
    for (const s of $$('.tema-ajuda')) {
      let noTema = 0;
      for (const d of $$('.pergunta', s)) {
        const ok = (temaAjuda === 'todos' || s.dataset.tema === temaAjuda) && palavras.every((w) => d.dataset.busca.includes(w));
        d.hidden = !ok;
        if (ok) noTema++;
        if (palavras.length) d.open = ok && noTema <= 3;
      }
      s.hidden = !noTema;
      achou += noTema;
    }
    $('.nada-achado').hidden = achou > 0;
  };
  busca.oninput = filtrar;
  $$('[data-tema]', $('.ajuda-temas')).forEach((b) => (b.onclick = () => {
    temaAjuda = b.dataset.tema;
    $$('[data-tema]', $('.ajuda-temas')).forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    filtrar();
  }));
  filtrar();
}

// ---------- Atualiza sozinho ----------
async function recarregar(redesenhar = true) {
  const e = await pedir('estado');
  if (!e.ok) return;
  estado = e;
  vigiar.ultima = e.versao;
  lado();
  faixas();
  if (redesenhar) { const y = window.scrollY; await mostrar(); window.scrollTo(0, y); }
}
// A IA pediu esta tela (npm run painel com o painel já na tela): troca aqui mesmo, sem aba nova. Com algo sem salvar
// ou um vídeo tocando, só avisa na faixa (a pessoa clica em "Ver agora")
async function irPara(rota, agora = false) {
  if (!agora && ocupado()) { faixas.irPara = rota || location.hash; faixas(); return; }
  await recarregar(false);
  if (rota && location.hash !== rota) location.replace(rota); else await mostrar();
  avisar('A IA abriu esta tela pra você');
}

async function vigiar() {
  if (!acabou && aposentada !== 'velha') {
    // A cada pergunta, a aba conta pra Máquina se está na tela (assim o npm run painel não abre aba nova à toa)
    const r = await pedir(`versao?aba=${ABA}&visivel=${document.visibilityState === 'visible' ? 1 : 0}`);
    if (r.ir != null) await irPara(r.ir);
    if (!r.versao) falhas++;
    else {
      const novo = r.versao !== vigiar.ultima;
      if (falhas) { falhas = 0; faixas(); }
      vigiar.ultima = r.versao;
      if (novo) {
        if (ocupado()) { faixas.novidade = true; await recarregar(false); }
        else await recarregar(true);
      }
    }
    if (falhas >= 2) faixas();
  }
  setTimeout(vigiar, 3000);
}

// ---------- Uma aba só ----------
// Quando a IA abre o painel numa aba nova, a velha se fecha sozinha (se tiver coisa sem salvar, fica, com um aviso). O
// navegador só deixa a página fechar a aba que tem uma página só no histórico: por isso os links do painel trocam de
// tela sem criar página nova no histórico (o voltar do navegador não volta de tela; o menu do lado faz isso)
document.addEventListener('click', (e) => {
  const a = e.target.closest && e.target.closest('a[href^="#/"]');
  if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || a.target) return;
  e.preventDefault();
  location.replace(a.getAttribute('href'));
});
const outrasAbas = 'BroadcastChannel' in window ? new BroadcastChannel('preguica3d-painel') : null;
if (outrasAbas) {
  outrasAbas.onmessage = ({ data: m }) => {
    if (!m || aposentada === 'velha') return;
    if (m.tipo === 'cheguei' && m.nasceu > NASCEU) {
      if (ocupado()) { aposentada = 'ocupada'; faixas(); outrasAbas.postMessage({ tipo: 'fiquei' }); return; }
      aposentada = 'velha';
      window.close();
      setTimeout(faixas, 300); // o navegador não deixou fechar: a faixa avisa
    } else if (m.tipo === 'fiquei') { faixas.outraAba = true; faixas(); }
  };
  outrasAbas.postMessage({ tipo: 'cheguei', nasceu: NASCEU });
}
// A aba que acabou de aparecer na tela avisa na hora (sem esperar a próxima pergunta de 3 s)
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && aposentada !== 'velha') pedir(`versao?aba=${ABA}&visivel=1`).then((r) => { if (r.ir != null) irPara(r.ir); });
});

(async () => {
  const e = await pedir('estado');
  if (!e.ok) { app.innerHTML = `<p class="caixa erro">${esc(e.mensagem)}</p>`; return; }
  estado = e;
  vigiar.ultima = e.versao;
  lado();
  faixas();
  await mostrar();
  carregarConferir();
  vigiar(); // já conta pra Máquina que esta aba está na tela
})();
</script>
